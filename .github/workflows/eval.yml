name: Run eval

# Runs the test suites through the agent and commits the results to eval/results/.
# Needs the GEMINI_API_KEY repository secret (Settings -> Secrets and variables -> Actions).

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite: aa (Answer Accuracy), conversation, or all"
        default: aa
        type: choice
        options: [aa, conversation, all]
      runs:
        description: "Runs per question (the rubric uses 3; use 1 on a free-tier key)"
        default: "3"
        type: choice
        options: ["1", "3"]
      ids:
        description: "Only these test IDs, comma separated (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make sure the data store exists
        run: npm run corpus -- --if-missing
      - name: Run the suite
        env:
          SUITE: ${{ inputs.suite }}
          RUNS: ${{ inputs.runs }}
          IDS: ${{ inputs.ids }}
          OUT: eval/results/run-${{ github.run_number }}
        run: |
          if [ -n "$IDS" ]; then
            npm run eval -- --suite "$SUITE" --runs "$RUNS" --out "$OUT" --ids "$IDS"
          else
            npm run eval -- --suite "$SUITE" --runs "$RUNS" --out "$OUT"
          fi
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/results
          if git diff --cached --quiet; then echo "Nothing to commit."; else git commit -m "Eval results (run ${{ github.run_number }})" && git push; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ github.run_number }}
          path: eval/results/run-${{ github.run_number }}

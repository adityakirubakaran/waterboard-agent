name: Build data store

# Downloads the inventory pages and files chosen in data/data-store.json (and, if turned on, the Water
# Board pages they link to), extracts their text, and commits the snapshot to data/corpus/ (Vercel then
# redeploys with it). Runs when the settings or source list change, or by hand from the Actions tab.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/data-store.json
      - data/sources.csv
      - data/inventory/**
      - scripts/build-corpus.ts
      - lib/extract.ts

permissions:
  contents: write

concurrency:
  group: data-store
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild the source list from the inventory (tiers set in data/data-store.json)
        run: npm run sources
      - name: Download and extract the pages and files
        run: npm run corpus
      - name: Add embeddings (skipped if the GEMINI_API_KEY secret is not set)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run embed
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/sources.csv data/corpus
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update data store snapshot"
            git push
          fi
